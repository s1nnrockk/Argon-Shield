<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Argon Shield</title>
<style>
:root{color-scheme:dark;--cyan:#00f5ff;--violet:#a855f7;--bg:#080b16;--muted:#8994b3}*{box-sizing:border-box}body{margin:0;width:320px;min-height:350px;background:radial-gradient(ellipse at 50% -20%,#25265a 0,transparent 60%),var(--bg);color:#f4f7ff;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{padding:22px}.top{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:1.8px}.brand img{width:34px;height:34px}.gear{border:1px solid #343c5a;background:#11172a;color:#b7c4e9;border-radius:11px;width:38px;height:38px;font-size:20px;cursor:pointer;transition:.2s}.gear:hover{border-color:var(--cyan);color:var(--cyan);transform:rotate(25deg)}.eyebrow{font-size:10px;letter-spacing:2.3px;color:var(--muted);margin-top:24px}.status{font-size:25px;font-weight:750;margin:4px 0 2px}.sub{font-size:12px;color:var(--muted);min-height:18px}.orb-wrap{display:grid;place-items:center;padding:23px 0 19px}.orb{width:116px;height:116px;border-radius:50%;border:1px solid #303a5b;background:radial-gradient(circle at 35% 25%,#2d3c60,#10162a 65%);box-shadow:inset 0 0 22px #141d3a,0 0 0 8px #11172a;display:grid;place-items:center;cursor:pointer;transition:transform .25s,box-shadow .35s,border-color .3s}.orb span{font-size:32px;color:#65718f;transition:.3s}.orb.on{border-color:var(--cyan);box-shadow:inset 0 0 28px #00f5ff25,0 0 24px #00f5ff55,0 0 0 8px #00f5ff0b;animation:pulse 2.6s infinite}.orb.on span{color:var(--cyan);text-shadow:0 0 15px #00f5ff}.orb:active{transform:scale(.95)}@keyframes pulse{50%{box-shadow:inset 0 0 28px #00f5ff25,0 0 32px #00f5ff66,0 0 0 12px #00f5ff08}}.meta{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid #202943;font-size:11px;color:var(--muted)}.meta strong{display:block;color:#e9edff;font-size:12px;font-weight:650;margin-top:3px;max-width:150px;overflow-wrap:anywhere}.foot{text-align:center;color:#505b7a;font-size:10px;letter-spacing:1.4px;margin-top:4px}.error{color:#ff7795}.diagnostic{font-size:11px;line-height:1.45;color:#9aa6c5;padding:10px 11px;margin:0 0 12px;border:1px solid #29324c;background:#0c1221;border-radius:10px;overflow-wrap:anywhere}.clear-error{margin-top:7px;border:1px solid #4a3656;background:#171326;color:#d9b9ff;border-radius:8px;padding:5px 8px;font-size:11px;cursor:pointer}.clear-error[hidden]{display:none}
</style></head>
<body><main class="wrap">
<header class="top"><div class="brand"><img src="icon.svg" alt=""><span>ARGON SHIELD</span></div><button class="gear" id="settings" aria-label="Открыть настройки" title="Настройки">⚙</button></header>
<div class="eyebrow">SECURE ROUTING / FIREFOX</div><div class="status" id="status">Проверка…</div><div class="sub" id="sub">Загружаем конфигурацию</div>
<div class="orb-wrap"><button id="toggle" class="orb" aria-label="Включить прокси"><span>⏻</span></button></div>
<div class="meta"><div>ПРОКСИ-СЕРВЕР<strong id="server">Не настроен</strong></div><div>РЕЖИМ<strong id="mode">Все сайты</strong></div></div>\n<div class="diagnostic" id="proxyError" role="status" aria-live="polite">Проверяем состояние…</div><button class="clear-error" id="clearError" type="button" hidden>Скрыть ошибку</button>
<div class="foot">NEON NETWORK CONTROL · v1.0</div>
</main><script src="popup.js"></script></body></html>
